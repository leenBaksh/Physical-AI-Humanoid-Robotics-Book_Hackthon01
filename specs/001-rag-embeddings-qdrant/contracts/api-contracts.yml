# API Contracts: RAG Embeddings and Qdrant Vector Database Integration

## Content Ingestion API

### POST /api/v1/content/ingest
**Description**: Ingest content from specified URLs and generate embeddings

**Request**:
```json
{
  "urls": ["https://example.com/page1", "https://example.com/page2"],
  "chunk_size": 512,
  "overlap_size": 50
}
```

**Response (200 OK)**:
```json
{
  "job_id": "uuid-string",
  "status": "processing",
  "total_urls": 2,
  "estimated_completion": "2026-01-01T12:00:00Z"
}
```

### GET /api/v1/content/ingest/{job_id}
**Description**: Get status of a content ingestion job

**Response (200 OK)**:
```json
{
  "job_id": "uuid-string",
  "status": "completed",
  "processed_count": 2,
  "failed_count": 0,
  "total_chunks": 45,
  "start_time": "2026-01-01T11:00:00Z",
  "end_time": "2026-01-01T11:05:00Z",
  "duration_seconds": 300
}
```

## Vector Storage API

### POST /api/v1/vectors/batch-upsert
**Description**: Batch upsert vector embeddings with metadata

**Request**:
```json
{
  "vectors": [
    {
      "id": "uuid-string",
      "vector": [0.1, 0.3, 0.5, ...],
      "payload": {
        "content": "Sample content text...",
        "source_url": "https://example.com/page1",
        "chunk_index": 0
      }
    }
  ]
}
```

**Response (200 OK)**:
```json
{
  "inserted_count": 1,
  "updated_count": 0,
  "failed_count": 0
}
```

## Utility APIs

### GET /api/v1/health
**Description**: Health check endpoint

**Response (200 OK)**:
```json
{
  "status": "healthy",
  "timestamp": "2026-01-01T11:00:00Z"
}
```