openapi: 3.0.0
info:
  title: RAG Chatbot API
  description: API for the RAG (Retrieval Augmented Generation) system that powers the book's chatbot
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://api.example.com
    description: Production server

paths:
  /health:
    get:
      summary: Check API health
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2025-12-31T10:00:00Z"

  /api/query:
    post:
      summary: Query the RAG system for book content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
                - session_id
              properties:
                query:
                  type: string
                  description: The user's question
                  example: "What are the core concepts of ROS 2?"
                session_id:
                  type: string
                  description: Unique identifier for the chat session
                  example: "session-12345"
                selected_text:
                  type: string
                  description: Optional text selected by user for context-specific Q&A
                  example: "ROS 2 is a flexible framework for writing robot applications"
                context:
                  type: object
                  description: Additional context for the query
                  properties:
                    module:
                      type: string
                      description: Module context for the query
                    chapter:
                      type: string
                      description: Chapter context for the query
      responses:
        '200':
          description: Successful response from the RAG system
          content:
            application/json:
              schema:
                type: object
                required:
                  - response
                  - sources
                  - session_id
                properties:
                  response:
                    type: string
                    description: The answer to the user's question
                    example: "ROS 2 (Robot Operating System 2) is a flexible framework for writing robot applications..."
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier for the source chunk
                        content:
                          type: string
                          description: The content of the source chunk
                        source_file:
                          type: string
                          description: Path to the source file
                        page_number:
                          type: integer
                          description: Page number in the source
                  session_id:
                    type: string
                    description: The session ID
                  context_used:
                    type: string
                    description: Whether context-specific Q&A was used
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/session/{session_id}:
    get:
      summary: Get chat session details
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chat session details
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  last_activity:
                    type: string
                    format: date-time
                  message_count:
                    type: integer
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a chat session
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session deleted successfully
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/index/status:
    get:
      summary: Get the status of the RAG index
      responses:
        '200':
          description: Index status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ready, updating, error]
                  document_count:
                    type: integer
                  last_updated:
                    type: string
                    format: date-time
                  version:
                    type: string

  /api/index/rebuild:
    post:
      summary: Rebuild the RAG index with latest content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Whether to force rebuild even if index is current
                  default: false
      responses:
        '200':
          description: Index rebuild initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "rebuild initiated"
                  job_id:
                    type: string
                    example: "job-12345"

components:
  schemas:
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: "error_code"
        message:
          type: string
          example: "Descriptive error message"